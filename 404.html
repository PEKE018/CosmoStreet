<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Página no encontrada — COSMO</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0D0D0D;
      color: #E0D8D0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .wrap { max-width: 420px; }
    .logo { color: #E0D8D0; margin-bottom: 2rem; display: flex; justify-content: center; }
    .cosmo-logo-svg { display: block; height: 32px; width: auto; }
    .code { font-size: 5rem; font-weight: 700; color: #C8A4B4; line-height: 1; }
    h1 { font-size: 1.1rem; font-weight: 400; color: #888; margin: 0.75rem 0 1.5rem; }
    a {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #C8A4B4;
      color: #0D0D0D;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 1px;
      transition: opacity .2s;
    }
    a:hover { opacity: .8; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><svg class="cosmo-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none" aria-label="COSMO" role="img"><path d="M21.78,10.22 A11,11 0 1,0 21.78,25.78" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><polygon points="28,14 29.13,16.87 32,18 29.13,19.13 28,22 26.87,19.13 24,18 26.87,16.87" fill="currentColor"/></svg></div>
    <div class="code">404</div>
    <h1>La página que buscás no existe.</h1>
    <a href="/">Volver a la tienda</a>
  </div>
</body>
</html>
